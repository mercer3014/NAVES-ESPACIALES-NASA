<!doctype html><html><head><meta charset="utf-8"><title>P3-2 viewer</title>
<style>html,body{margin:0;background:#111;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/game/node_modules/three/build/three.module.js","three/addons/":"/game/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const file = q.get('glb');
const req = (q.get('req') || '').split(',').filter(Boolean);
const cam = (q.get('cam') || '8,4,8').split(',').map(Number);
const tgt = (q.get('tgt') || '0,1,0').split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1024, 768); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c0d10);
const camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 60), 1024 / 768, 0.05, 500);
camera.position.set(...cam);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(...tgt); controls.update();
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x302a24, 0.6));
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(file, (g) => {
  const root = g.scene; scene.add(root);
  // simula lo que haria el codigo del juego con los empties light-*
  root.traverse((o) => {
    const ex = o.userData || {};
    if (o.name.startsWith('light-')) {
      const col = new THREE.Color(ex.color || '#ffffff');
      const L = new THREE.PointLight(col, (ex.intensity || 4) * 2.2, ex.distance || 12, 1.6);
      o.add(L);
    }
  });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const missing = req.filter((n) => !root.getObjectByName(n));
  let inst = 0; root.traverse((o) => { if (o.isInstancedMesh) inst += o.count; });
  renderer.render(scene, camera);
  window.__result = { ok: true, size: size.toArray().map((v) => +v.toFixed(2)), min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)), missing, instancedMeshInstances: inst, drawCalls: renderer.info.render.calls, trisRendered: renderer.info.render.triangles };
  function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); } loop();
}, undefined, (e) => { window.__result = { ok: false, error: String(e) }; });
</script></body></html>
